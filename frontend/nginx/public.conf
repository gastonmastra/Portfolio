server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's DNS: re-resolve the API so restarting its container never leaves a stale IP.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api http://public-api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
