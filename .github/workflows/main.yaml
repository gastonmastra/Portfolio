name: Build and Deploy script

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and build the public site
        working-directory: frontend
        run: npm ci && npm run build:public:prod

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist/public/browser
          branch: prod
          token: ${{ secrets.PAGE }}
